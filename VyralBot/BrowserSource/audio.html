<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VyralBot Audio - Browser Source</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #status {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: opacity 0.3s;
            z-index: 9999;
        }

        .connected {
            background: rgba(0, 255, 0, 0.2);
            color: lime;
            border: 2px solid lime;
        }

        .disconnected {
            background: rgba(255, 0, 0, 0.2);
            color: red;
            border: 2px solid red;
        }

        .connecting {
            background: rgba(255, 255, 0, 0.2);
            color: yellow;
            border: 2px solid yellow;
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="status" class="connecting">Connecting to VyralBot...</div>

    <script>
        // Configuration
        const WS_URL = 'ws://localhost:8080';
        const SOUNDS_URL = 'http://localhost:8080/sounds/';
        const RECONNECT_DELAY = 3000; // 3 seconds
        const STATUS_HIDE_DELAY = 5000; // 5 seconds

        // State
        let ws = null;
        let soundCache = {};
        let reconnectTimeout = null;
        let statusHideTimeout = null;

        // DOM Elements
        const statusDiv = document.getElementById('status');

        // Initialize
        connectWebSocket();

        function connectWebSocket() {
            updateStatus('Connecting to VyralBot...', 'connecting');

            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                console.log('✅ Connected to VyralBot Audio WebSocket');
                updateStatus('✅ Connected to VyralBot', 'connected');
                
                // Hide status after 5 seconds
                clearTimeout(statusHideTimeout);
                statusHideTimeout = setTimeout(() => {
                    statusDiv.classList.add('hidden');
                }, STATUS_HIDE_DELAY);

                // Clear any pending reconnect
                if (reconnectTimeout) {
                    clearTimeout(reconnectTimeout);
                    reconnectTimeout = null;
                }
            };

            ws.onclose = (event) => {
                console.log('❌ Disconnected from VyralBot:', event.code, event.reason);
                updateStatus('❌ Disconnected - Reconnecting...', 'disconnected');
                statusDiv.classList.remove('hidden');

                // Attempt to reconnect
                reconnectTimeout = setTimeout(() => {
                    console.log('🔄 Attempting to reconnect...');
                    connectWebSocket();
                }, RECONNECT_DELAY);
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onmessage = async (event) => {
                try {
                    const audioEvent = JSON.parse(event.data);
                    console.log('🎵 Received audio event:', audioEvent);
                    await playSound(audioEvent);
                } catch (error) {
                    console.error('Error processing audio event:', error);
                }
            };
        }

        async function playSound(audioEvent) {
            const { soundFile, volume = 1.0, eventType, platform } = audioEvent;

            if (!soundFile) {
                console.warn('No sound file specified in audio event');
                return;
            }

            try {
                // Preload sound if not cached
                if (!soundCache[soundFile]) {
                    console.log(`📥 Preloading sound: ${soundFile}`);
                    soundCache[soundFile] = new Audio(SOUNDS_URL + soundFile);
                    
                    // Wait for sound to be loaded
                    await new Promise((resolve, reject) => {
                        soundCache[soundFile].addEventListener('canplaythrough', resolve, { once: true });
                        soundCache[soundFile].addEventListener('error', reject, { once: true });
                        soundCache[soundFile].load();
                    });
                }

                // Clone the audio to allow multiple simultaneous plays
                const audio = soundCache[soundFile].cloneNode();
                audio.volume = Math.max(0, Math.min(1, volume)); // Clamp 0-1

                // Play with error handling
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log(`✅ Playing ${soundFile} for ${eventType} on ${platform}`);
                        })
                        .catch((error) => {
                            console.error(`❌ Failed to play ${soundFile}:`, error);
                        });
                }
            } catch (error) {
                console.error(`Error loading/playing sound ${soundFile}:`, error);
            }
        }

        function updateStatus(message, className) {
            statusDiv.textContent = message;
            statusDiv.className = className;
        }

        // Prevent context menu on right-click (cleaner for OBS)
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        // Log when page is loaded
        console.log('🎬 VyralBot Audio Browser Source loaded');
        console.log(`🌐 WebSocket URL: ${WS_URL}`);
        console.log(`📁 Sounds URL: ${SOUNDS_URL}`);
    </script>
</body>
</html>
